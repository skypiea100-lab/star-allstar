<script>
const V='22';

const MAPS=[
{name:'네오 아카디아',type:'운영형',boost:'macro'},{name:'블루 스톰',type:'난전형',boost:'sense'},{name:'파이썬',type:'균형형',boost:'strategy'},{name:'투혼',type:'공격형',boost:'attack'},{name:'신 단장의 능선',type:'멀티형',boost:'macro'},{name:'데스티네이션',type:'견제형',boost:'harass'},{name:'카트리나',type:'장기전형',boost:'defense'}

['박성준','Z',[517,529,497,508,495,490,515,513],[975,990,945,965,940,930,975,970]],
['홍진호','Z',[497,507,493,500,502,495,509,513],[955,970,945,955,960,945,970,980]],
['조용호','Z',[491,496,507,509,503,498,489,507],[945,955,970,975,965,955,945,970]],
['김택용','P',[529,526,508,517,528,523,537,532],[985,980,955,970,985,980,995,990]],
['강민','P',[501,506,497,504,531,524,520,513],[950,960,945,955,995,985,980,970]],

function freshSeason(){return{w:0,l:0,setsW:0,setsL:0,playoffW:0,playoffL:0,streak:0,maxStreak:0,fatigue:0,leagueRank:null,playoffRank:null,leagueP:0,playoffP:0,upsets:0,recent:[]}}
function freshPlayer(x,i){let stats={},baseStats={},pot={};STAT_KEYS.forEach((k,j)=>{stats[k]=x[2][j];baseStats[k]=x[2][j];pot[k]=x[3][j]});return{id:i,name:x[0],race:x[1],baseStats,stats,potential:pot,agePhase:i===0?'전성기':['상승기','전성기','안정기'][i%3],career:{leagueP:0,playoffP:0,titles:0,runnerups:0,leagueFirsts:0,finals:0,mvp:0,awards:0,wins:0,losses:0},season:freshSeason(),growthReason:[],growthHistory:[]}}
function newState(){return{version:V,seasonNo:1,phase:'ready',selectedPlayer:0,training:'balanced',goal:'auto',autoStrategy:true,players:PLAYER_SEED.map(freshPlayer),schedule:[],matchIndex:0,playoff:null,head2head:{},seasonStories:[],seasons:[],lastMatch:null,activeSeries:null,activeTab:'home',upsets:[],powerBaseline:{},lastSeasonSummary:null}}
function normalizeState(x){if(!x||!Array.isArray(x.players))return newState();x.version=V;x.head2head=x.head2head||{};x.seasonStories=x.seasonStories||[];x.seasons=x.seasons||[];x.upsets=x.upsets||[];x.powerBaseline=x.powerBaseline||{};x.activeSeries=x.activeSeries||null;x.players.forEach((p,i)=>{let seed=PLAYER_SEED[i];if(!seed)return;if(!p.baseStats)p.baseStats={};if(!p.stats)p.stats={};if(!p.potential)p.potential={};STAT_KEYS.forEach((k,j)=>{if(p.baseStats[k]==null)p.baseStats[k]=seed[2][j];if(p.stats[k]==null||p.stats[k]>1000)p.stats[k]=seed[2][j];if(p.potential[k]==null)p.potential[k]=seed[3][j]});p.career=Object.assign({leagueP:0,playoffP:0,titles:0,runnerups:0,leagueFirsts:0,finals:0,mvp:0,awards:0,wins:0,losses:0},p.career||{});p.season=Object.assign(freshSeason(),p.season||{});if(!Array.isArray(p.season.recent))p.season.recent=[];p.growthReason=p.growthReason||[];p.growthHistory=p.growthHistory||[]});return x}
let S=load();
function load(){try{let current=localStorage.getItem(STORAGE),legacyKey=null,raw=current;if(!raw){for(let k of OLD_STORAGES){let v=localStorage.getItem(k);if(v){raw=v;legacyKey=k;break}}}if(raw){let x=normalizeState(JSON.parse(raw));if(legacyKey==='star_allstar_v20_iphone_state'){x.players.forEach((p,i)=>{let seed=PLAYER_SEED[i];STAT_KEYS.forEach((k,j)=>{p.baseStats[k]=seed[2][j]});if(STAT_KEYS.reduce((a,k)=>a+p.stats[k],0)/STAT_KEYS.length>700){STAT_KEYS.forEach((k,j)=>p.stats[k]=seed[2][j]);p.growthReason=['v22 마이그레이션: 잘못 복원된 구버전 고능력치를 성장 밸런스로 복구']}})}return x}}catch(e){}return newState()}
function save(){try{S.version=V;localStorage.setItem(STORAGE,JSON.stringify(S));storageAvailable=true}catch(e){storageAvailable=false}}
function exportSave(){save();let blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`star-allstar-v22-season${S.seasonNo}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast('저장 파일을 내보냈습니다')}
function importSave(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{S=normalizeState(JSON.parse(r.result));save();render();toast('저장 데이터를 불러왔습니다')}catch(e){toast('올바른 저장 파일이 아닙니다')}};r.readAsText(file)}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function avg(p){return STAT_KEYS.reduce((a,k)=>a+p.stats[k],0)/STAT_KEYS.length}

function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function story(icon,title,text){S.seasonStories.unshift({icon,title,text,ts:Date.now()});if(S.seasonStories.length>80)S.seasonStories.pop()}
function h2key(a,b){return a<b?`${a}-${b}`:`${b}-${a}`}
function h2h(a,b){let k=h2key(a,b);if(!S.head2head[k])S.head2head[k]={a:Math.min(a,b),b:Math.max(a,b),aw:0,bw:0,important:0};return S.head2head[k]}
function addH2H(w,l,important){let h=h2h(w,l);if(w===h.a)h.aw++;else h.bw++;if(important)h.important++}
function relation(a,b){let h=h2h(a,b),n=h.aw+h.bw;if(n<5)return null;let wa=(a===h.a?h.aw:h.bw),wb=n-wa,ratio=Math.max(wa,wb)/n;if(n>=6&&ratio>=.72){let dom=wa>wb?a:b;return{type:'천적',dom}}if(n>=6&&Math.abs(wa-wb)<=Math.max(2,Math.floor(n*.2))&&(h.important>=1||n>=8))return{type:'라이벌'};return null}
function phaseLabel(){return S.phase==='ready'?'시즌 준비':S.phase==='league'?'정규 풀리그':S.phase==='playoff'?'순위결정전':'시즌 종료'}
function makeSchedule(){let ids=S.players.map(p=>p.id),arr=[];for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)arr.push({a:ids[i],b:ids[j],played:false});return shuffle(arr)}
function resetSeasonStats(){S.players.forEach(p=>p.season=freshSeason());S.upsets=[]}
function powerScore(p){let recent=(p.season.recent||[]),form=recent.reduce((a,x)=>a+(x==='W'?12:-8),0),setDiff=(p.season.setsW||0)-(p.season.setsL||0);return avg(p)+form+setDiff*1.5+(p.season.streak||0)*2+(p.season.playoffW||0)*5}
function powerRanking(){return [...S.players].sort((a,b)=>powerScore(b)-powerScore(a)||avg(b)-avg(a))}
function startSeason(){if(S.phase!=='ready'&&S.phase!=='done')return;S.seasonNo+=(S.phase==='done'?1:0);resetSeasonStats();S.powerBaseline={};powerRanking().forEach((p,i)=>S.powerBaseline[p.id]=i+1);S.schedule=makeSchedule();S.matchIndex=0;S.playoff=null;S.seasonStories=[];S.lastMatch=null;S.activeSeries=null;S.phase='league';story('🎬',`시즌 ${S.seasonNo} 개막`,'16명의 선수가 15경기 풀리그를 시작했습니다.');save();render();goTab('match');toast('새 시즌이 시작되었습니다')}
function standings(){return [...S.players].sort((a,b)=>b.season.w-a.season.w||((b.season.setsW-b.season.setsL)-(a.season.setsW-a.season.setsL))||avg(b)-avg(a))}
function currentLeagueMatch(){while(S.matchIndex<S.schedule.length&&S.schedule[S.matchIndex].played)S.matchIndex++;return S.schedule[S.matchIndex]||null}
function isSelectedMatch(a,b){return a===S.selectedPlayer||b===S.selectedPlayer}
function hasFutureSelectedMatch(){if(S.phase==='league')return true;if(S.phase==='playoff'){let p=pById(S.selectedPlayer);return !!(p&&p.season.playoffRank==null&&playoffMatchInfo())}return false}
function createSeries(a,b,bestOf,label,isPlayoff=false,oppRank=null){let baseMap=MAPS[Math.floor(Math.random()*MAPS.length)];return{a:a.id,b:b.id,aw:0,bw:0,bestOf,label,isPlayoff,oppRank,sets:[],expectedA:winProb(a,b,baseMap,isPlayoff),started:Date.now()}}
function ensureActiveSeries(){if(S.activeSeries)return S.activeSeries;let e=currentExpected();if(!e)return null;S.activeSeries=createSeries(e.a,e.b,e.bestOf,e.label,S.phase==='playoff',e.oppRank??null);return S.activeSeries}
function simulateOneSet(m){let a=pById(m.a),b=pById(m.b),map=MAPS[Math.floor(Math.random()*MAPS.length)],pa=winProb(a,b,map,m.isPlayoff),sa=strategyFor(a,map,b),sb=strategyFor(b,map,a),winner=Math.random()<pa?a:b;if(winner.id===a.id)m.aw++;else m.bw++;m.sets.push({no:m.sets.length+1,map:map.name,mapType:map.type,aRace:randomRace(a),bRace:randomRace(b),aStrategy:sa.name,bStrategy:sb.name,probA:pa,winner:winner.id});return winner}
function seriesDone(m){let need=Math.ceil(m.bestOf/2);return m.aw>=need||m.bw>=need}
function finalizeSeries(m){let a=pById(m.a),b=pById(m.b),winner=m.aw>m.bw?a:b,loser=winner.id===a.id?b:a,wp=winner.id===a.id?m.expectedA:1-m.expectedA;m.winner=winner.id;m.loser=loser.id;m.upset=wp<=.30;m.date=Date.now();if(m.isPlayoff)completePlayoffSeries(m);else completeLeagueSeries(m);S.activeSeries=null;return m}
function completeLeagueSeries(m){let sm=currentLeagueMatch();if(sm){sm.played=true;sm.result=m}applySeries(m,false);S.matchIndex++;if(S.matchIndex>=S.schedule.length)finishLeague()}
function completePlayoffSeries(m){let info=playoffMatchInfo(),oppRank=m.oppRank??info?.oppRank;applySeries(m,true);S.playoff.matches.push(m);let loser=pById(m.loser),winner=pById(m.winner);loser.season.playoffRank=S.playoff.placement;S.playoff.finished[loser.id]=S.playoff.placement;if(winner.id===S.playoff.challenger&&oppRank<=12&&S.playoff.matches.length>=4)story('🚀',`${winner.name} 미라클런`,`${S.playoff.matches.length}연속 순위결정전 승리로 ${oppRank}위권까지 올라왔습니다.`);S.playoff.challenger=winner.id;S.playoff.placement--;S.playoff.nextSeedIndex--;if(oppRank===1){winner.season.playoffRank=1;loser.season.playoffRank=2;S.playoff.finished[winner.id]=1;S.playoff.finished[loser.id]=2;S.playoff.champion=winner.id;finishSeason()}}
function playOneSet(){if(S.phase!=='league'&&S.phase!=='playoff')return;let m=ensureActiveSeries();if(!m)return;let w=simulateOneSet(m);if(seriesDone(m)){let done=finalizeSeries(m);save();render();toast(`${pById(done.winner).name} ${done.aw}:${done.bw} 승리`)}else{save();render();goTab('match');toast(`${m.sets.length}세트 · ${w.name} 승리`)}}
function runCurrentSeriesToEnd(){let m=ensureActiveSeries();if(!m)return null;while(!seriesDone(m))simulateOneSet(m);return finalizeSeries(m)}
function runLeagueMatchCore(){if(S.phase!=='league')return null;let sm=currentLeagueMatch();if(!sm){finishLeague();return null}return runCurrentSeriesToEnd()}
function runPlayoffMatchCore(){if(S.phase!=='playoff')return null;return runCurrentSeriesToEnd()}
function advanceToMyMatch(){if(S.phase==='ready'||S.phase==='done'){toast(S.phase==='ready'?'시즌을 먼저 시작해 주세요':'시즌이 종료되었습니다');return}let e=currentExpected();if(e&&isSelectedMatch(e.a.id,e.b.id)){goTab('match');toast('현재 경기가 내 경기입니다');return}if(S.activeSeries){runCurrentSeriesToEnd()}let skipped=0,guard=0;while(guard++<250){if(S.phase==='league'){let sm=currentLeagueMatch();if(!sm){finishLeague();continue}if(isSelectedMatch(sm.a,sm.b))break;runLeagueMatchCore();skipped++;continue}if(S.phase==='playoff'){let me=pById(S.selectedPlayer);if(!me||me.season.playoffRank!=null)break;let info=playoffMatchInfo();if(!info)break;if(isSelectedMatch(info.a.id,info.b.id))break;runPlayoffMatchCore();skipped++;continue}break}save();render();goTab('match');let now=currentExpected(),me=pById(S.selectedPlayer);if(now&&isSelectedMatch(now.a.id,now.b.id))toast(`${skipped}경기 자동 진행 · ${me.name} 경기 도착`);else if(S.phase==='playoff'&&me?.season.playoffRank!=null)toast(`${me.name}의 이번 시즌 경기가 모두 끝났습니다`);else toast(skipped?`${skipped}경기를 자동 진행했습니다`:'다음 내 경기가 없습니다')}
function strategyFor(p,map,opp){let choices=[['초반 압박','attack'],['운영 중심','macro'],['수비 후 역습','defense'],['견제 집중','harass'],['심리전·변칙','strategy']];let best=choices[0],bestScore=-1e9;choices.forEach(c=>{let score=p.stats[c[1]]+(map.boost===c[1]?24:0)+(p.stats[c[1]]-opp.stats[c[1]])*.15;if(score>bestScore){best=c;bestScore=score}});return{name:best[0],key:best[1],reason:`${STAT_LABEL[best[1]]} ${p.stats[best[1]]} · ${map.type}${map.boost===best[1]?' 보정':''}`}}
function formBonus(p){let s=p.season.streak;if(s>=3)return Math.min(3,(s-2)*.7);if(s<=-3)return -Math.min(3,(-s-2)*.7);return 0}
function winProb(a,b,map,isPlayoff=false){let ra=avg(a),rb=avg(b);let diff=(ra-rb)/45;diff+=(a.stats[map.boost]-b.stats[map.boost])/180;diff+=(formBonus(a)-formBonus(b))/100;if(isPlayoff)diff+=(-a.season.fatigue+b.season.fatigue)/180;return clamp(1/(1+Math.exp(-diff)),.12,.88)}
function randomRace(p){if(p.race!=='R')return p.race;return ['T','Z','P'][Math.floor(Math.random()*3)]}
function applySeries(m,isPlayoff=false){let a=pById(m.a),b=pById(m.b),w=pById(m.winner),l=pById(m.loser);if(isPlayoff){w.season.playoffW++;l.season.playoffL++}else{a.season.setsW+=m.aw;a.season.setsL+=m.bw;b.season.setsW+=m.bw;b.season.setsL+=m.aw;w.season.w++;l.season.l++}w.career.wins++;l.career.losses++;w.season.recent=(w.season.recent||[]).concat('W').slice(-5);l.season.recent=(l.season.recent||[]).concat('L').slice(-5);w.season.streak=w.season.streak>0?w.season.streak+1:1;l.season.streak=l.season.streak<0?l.season.streak-1:-1;w.season.maxStreak=Math.max(w.season.maxStreak,w.season.streak);if(w.season.streak===3||w.season.streak===5||w.season.streak===8||w.season.streak===10)story('🔥',`${w.name} ${w.season.streak}연승`,`${m.label}에서 상승세를 이어갔습니다.`);if(l.season.streak===-5)story('🧊',`${l.name} 슬럼프`,`${Math.abs(l.season.streak)}연패에 빠졌습니다.`);let important=isPlayoff||m.label.includes('결승');addH2H(w.id,l.id,important);let rel=relation(w.id,l.id);if(rel?.type==='라이벌')story('⚔️',`${w.name} · ${l.name} 라이벌 구도`, '접전 상대전적과 중요 경기 맞대결이 쌓였습니다.');if(m.upset){w.season.upsets++;let wp=(w.id===a.id?m.expectedA:1-m.expectedA),score=Math.round((.5-wp)*160+Math.max(0,avg(l)-avg(w))/2);m.upsetScore=score;S.upsets.push({winner:w.id,loser:l.id,score,label:m.label,date:m.date,match:m});S.upsets.sort((x,y)=>y.score-x.score);story('💥',`${w.name} 대이변!`,`${l.name}을 상대로 사전 승리 확률 ${Math.round(wp*100)}%를 뒤집었습니다. · 업셋 ${score}점`)}S.lastMatch=m;showResult(m);if(isPlayoff)w.season.fatigue=Math.min(12,w.season.fatigue+1.6)}
function showResult(m){let w=pById(m.winner),l=pById(m.loser),score=w.id===m.a?`${m.aw}:${m.bw}`:`${m.bw}:${m.aw}`;let icon=m.label==='결승전'?'👑':m.upset?'💥':'🏆';document.getElementById('resultIcon').textContent=icon;document.getElementById('resultTitle').textContent=`${w.name} 승리!  ${score}  ${l.name}`;document.getElementById('resultSub').textContent=`${m.label} · ${m.bestOf}전 ${Math.ceil(m.bestOf/2)}선승${m.upset?' · 대이변':''}`;document.getElementById('resultBanner').classList.add('show')}
function playLeagueMatch(){if(S.phase!=='league')return;runLeagueMatchCore();save();render()}
function finishLeague(){let st=standings();st.forEach((p,i)=>{p.season.leagueRank=i+1;p.season.leagueP=16-i;p.career.leagueP+=16-i});st[0].career.leagueFirsts=(st[0].career.leagueFirsts||0)+1;story('📋','정규리그 종료',`${st[0].name}이 ${st[0].season.w}승 ${st[0].season.l}패로 정규리그 1위를 차지했습니다.`);S.phase='playoff';S.playoff={seeds:st.map(p=>p.id),challenger:st[15].id,nextSeedIndex:14,placement:16,finished:{},matches:[],champion:null};save();toast('정규리그 종료 · 순위결정전 시작')}
function playoffMatchInfo(){if(S.phase!=='playoff'||!S.playoff)return null;let po=S.playoff;if(po.nextSeedIndex<0)return null;let oppRank=po.nextSeedIndex+1,label=oppRank===3?'준플레이오프':oppRank===2?'플레이오프':oppRank===1?'결승전':`${oppRank}위 진입 순위결정전`;return{a:pById(po.challenger),b:pById(po.seeds[po.nextSeedIndex]),bestOf:oppRank===1?7:5,label,oppRank}}
function playPlayoff(){if(S.phase!=='playoff')return;runPlayoffMatchCore();save();render()}
function growthStyleWeights(p){let pairs=STAT_KEYS.map(k=>[k,p.baseStats[k]-Math.min(...STAT_KEYS.map(x=>p.baseStats[x]))+18]);pairs.sort((a,b)=>b[1]-a[1]);let top=new Set(pairs.slice(0,3).map(x=>x[0]));return Object.fromEntries(STAT_KEYS.map(k=>[k,top.has(k)?1.7:1]))}
function weightedPick(weights){let entries=Object.entries(weights),sum=entries.reduce((a,[,v])=>a+v,0),r=Math.random()*sum;for(let [k,v] of entries){r-=v;if(r<=0)return k}return entries[0][0]}
function growPlayers(){S.players.forEach((p,idx)=>{p.growthReason=[];let beforeAvg=Math.round(avg(p)),phase=p.agePhase,phaseBase=phase==='상승기'?1.15:phase==='전성기'?1:phase==='안정기'?.82:.68,perf=clamp((p.season.w-7)/10+(p.season.playoffW||0)*.05,-.15,.28),weights=growthStyleWeights(p);if(idx===S.selectedPlayer){let boost=S.training==='attack'?['control','attack','sense']:S.training==='analysis'?['strategy','scout','sense']:S.training==='macro'?['macro','defense','sense']:S.training==='stable'?['defense','scout','strategy']:[];boost.forEach(k=>weights[k]*=1.45)}let rolls=4+(Math.random()<.45?1:0),deltaBy={};for(let i=0;i<rolls;i++){let k=Math.random()<.7?weightedPick(weights):STAT_KEYS[Math.floor(Math.random()*STAT_KEYS.length)],r=Math.random(),d=r<.03?5+Math.floor(Math.random()*2):r<.18?3+Math.floor(Math.random()*2):r<.68?1+Math.floor(Math.random()*3):r<.93?Math.floor(Math.random()*2):0;d=Math.round(d*phaseBase*(1+perf));if(phase==='안정기'&&Math.random()<.08)d=-1;if(d===0)continue;let before=p.stats[k];p.stats[k]=clamp(p.stats[k]+d,350,p.potential[k]);let actual=p.stats[k]-before;if(actual)deltaBy[k]=(deltaBy[k]||0)+actual}let entries=Object.entries(deltaBy).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1]));entries.slice(0,4).forEach(([k,d])=>p.growthReason.push(`${STAT_LABEL[k]} ${d>0?'+':''}${d} · ${Math.abs(d)>=5?'💥 재능 폭발':Math.abs(d)>=3?'🔥 큰 성장':'📈 시즌 성장'}`));if(entries.some(([,d])=>d>=5))story('💥',`${p.name} 재능 폭발`,`${STAT_LABEL[entries.find(([,d])=>d>=5)[0]]} 능력이 크게 성장했습니다.`);let afterAvg=Math.round(avg(p));p.growthHistory=(p.growthHistory||[]).concat({season:S.seasonNo,before:beforeAvg,after:afterAvg,delta:afterAvg-beforeAvg,phase:p.agePhase}).slice(-20);if(!p.growthReason.length)p.growthReason.push('능력치 유지 · 이번 시즌은 큰 변화 없음')})}
function awards(){let ps=[...S.players],mvp=[...ps].sort((a,b)=>((b.season.w*4+b.season.playoffW*5)+b.season.playoffP*2+b.season.upsets*3+(b.season.setsW-b.season.setsL))-((a.season.w*4+a.season.playoffW*5)+a.season.playoffP*2+a.season.upsets*3+(a.season.setsW-a.season.setsL)))[0],wins=[...ps].sort((a,b)=>(b.season.w+b.season.playoffW)-(a.season.w+a.season.playoffW))[0],streak=[...ps].sort((a,b)=>b.season.maxStreak-a.season.maxStreak)[0],rate=[...ps].sort((a,b)=>b.season.w/15-a.season.w/15)[0],climb=[...ps].sort((a,b)=>((b.season.leagueRank||16)-(b.season.playoffRank||16))-((a.season.leagueRank||16)-(a.season.playoffRank||16)))[0],fall=[...ps].sort((a,b)=>((b.season.playoffRank||16)-(b.season.leagueRank||16))-((a.season.playoffRank||16)-(a.season.leagueRank||16)))[0],topUpset=S.upsets[0];mvp.career.mvp++;[mvp,wins,streak,rate,climb,fall].forEach(p=>p.career.awards++);return[{t:'시즌 MVP',p:mvp.id,icon:'⭐'},{t:'최다 경기 승리',p:wins.id,v:`${wins.season.w+wins.season.playoffW}승`,icon:'⚔️'},{t:'최장 연승',p:streak.id,v:`${streak.season.maxStreak}연승`,icon:'🔥'},{t:'정규리그 최고 승률',p:rate.id,v:`${rate.season.w}승 ${rate.season.l}패`,icon:'🎯'},{t:'최고 순위 상승',p:climb.id,v:`${climb.season.leagueRank}위 → ${climb.season.playoffRank}위`,icon:'🚀'},{t:'최대 순위 하락',p:fall.id,v:`${fall.season.leagueRank}위 → ${fall.season.playoffRank}위`,icon:'📉'},...(topUpset?[{t:'시즌 최대 이변',p:topUpset.winner,v:`${pById(topUpset.loser).name} 격파 · ${topUpset.score}점`,icon:'💥'}]:[])]}
function eraText(){let hs=[...S.seasons.slice(-4),{champion:S.playoff?.champion}].filter(x=>x.champion!=null);if(hs.length<3)return '새로운 시대가 만들어지는 중';let c={};hs.forEach(x=>c[x.champion]=(c[x.champion]||0)+1);let [id,n]=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];if(n>=4)return `👑 ${pById(+id).name} 절대왕조`;if(n>=3)return `👑 ${pById(+id).name} 왕조`;if(Object.keys(c).length===hs.length)return '⚔️ 춘추전국 시대';return `🔥 ${pById(+id).name} 중심의 경쟁 시대`}
function finishSeason(){S.players.forEach(p=>{if(!p.season.playoffRank){let rank=S.playoff.finished[p.id];if(rank)p.season.playoffRank=rank}p.season.playoffP=PLAYOFF_P[p.season.playoffRank]??0;p.career.playoffP+=p.season.playoffP});let champ=pById(S.playoff.champion);champ.career.titles++;champ.career.finals=(champ.career.finals||0)+1;let runner=S.players.find(p=>p.season.playoffRank===2);if(runner){runner.career.runnerups++;runner.career.finals=(runner.career.finals||0)+1}let aw=awards(),leagueWinner=S.players.find(p=>p.season.leagueRank===1);growPlayers();let era=eraText();story('👑',`${champ.name} 시즌 ${S.seasonNo} 우승`,`${S.lastMatch.aw}:${S.lastMatch.bw} 결승 승리 · 리그 ${champ.season.leagueP}P + 순위결정전 ${champ.season.playoffP}P`);let finalRanks=[...S.players].sort((a,b)=>a.season.playoffRank-b.season.playoffRank).map(p=>p.id),rec={no:S.seasonNo,champion:champ.id,runnerup:runner?.id,leagueWinner:leagueWinner?.id,standings:standings().map(p=>p.id),finalRanks,points:S.players.map(p=>({id:p.id,l:p.season.leagueP,p:p.season.playoffP})),awards:aw,stories:[...S.seasonStories].slice(0,8),upsets:[...S.upsets].slice(0,5),era};S.seasons.push(rec);S.lastSeasonSummary=rec;S.phase='done';save();setTimeout(()=>openSeason(S.seasonNo),50);toast(`${champ.name} 우승! 시즌 종료`)}
function totalP(p){return p.career.leagueP+p.career.playoffP}
function currentExpected(){if(S.phase==='league'){let m=currentLeagueMatch();if(!m)return null;let a=pById(m.a),b=pById(m.b),map=MAPS[0];return{a,b,p:winProb(a,b,map,false),label:'정규리그',bestOf:3}}if(S.phase==='playoff'){let i=playoffMatchInfo();if(!i)return null;return{...i,p:winProb(i.a,i.b,MAPS[0],true)}}return null}
function renderNav(){document.getElementById('nav').innerHTML=NAV.map(([id,t])=>`<button class="${S.activeTab===id?'active':''}" onclick="goTab('${id}')">${t}</button>`).join('')}
function goTab(id){S.activeTab=id;save();document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById('tab-'+id).classList.add('active');renderNav();updateQuick()}
function updateQuick(){let b=document.getElementById('quickBtn'),m=document.getElementById('myMatchBtn');if(S.phase==='ready'||S.phase==='done'){b.textContent=S.phase==='done'?'다음 시즌 시작':'시즌 시작';b.disabled=false;m.classList.add('hidden')}else if(S.phase==='league'){b.textContent=S.activeSeries?'경기 끝까지':'다음 리그 경기';b.disabled=false;m.classList.remove('hidden');let e=currentExpected(),mine=e&&isSelectedMatch(e.a.id,e.b.id);m.textContent=mine?'현재가 내 경기':'내 경기로 넘기기';m.disabled=!!mine}else if(S.phase==='playoff'){b.textContent=S.activeSeries?'경기 끝까지':'다음 순위결정전';b.disabled=false;m.classList.remove('hidden');let e=currentExpected(),mine=e&&isSelectedMatch(e.a.id,e.b.id),me=pById(S.selectedPlayer),ended=me&&me.season.playoffRank!=null;m.textContent=ended?'내 경기 종료':mine?'현재가 내 경기':'내 경기로 넘기기';m.disabled=!!mine||!!ended}else{b.disabled=true;m.classList.add('hidden')}}
function quickAction(){if(S.phase==='ready'||S.phase==='done')startSeason();else if(S.phase==='league')playLeagueMatch();else if(S.phase==='playoff')playPlayoff()}
function seasonGoals(p){let rank=rankNow(p.id),goals=[{ok:p.season.w>=10,t:'정규리그 10승 달성'},{ok:rank<=4&&p.season.w+p.season.l>=8,t:'현재 TOP 4 유지'},{ok:(p.season.upsets||0)>=1,t:'강자 상대 이변 1회'}];return goals}
function rankZone(rank){return rank<=3?'🏆 우승 경쟁':rank<=8?'🔥 상위권 경쟁':rank<=12?'⚔️ 중위권': '⚠️ 하위권'}
function renderHome(){let st=standings(),sel=pById(S.selectedPlayer),played=S.schedule.filter(m=>m.played).length;document.getElementById('tab-home').innerHTML=`
<div class="summary-list"><div class="mini"><div class="label">현재 시즌</div><div class="value">${S.seasonNo}</div></div><div class="mini"><div class="label">진행 단계</div><div class="value">${phaseLabel()}</div></div><div class="mini"><div class="label">리그 경기</div><div class="value">${played}/120</div></div><div class="mini"><div class="label">시대</div><div class="value" style="font-size:14px">${eraText()}</div></div></div>
<div class="grid two" style="margin-top:14px"><div class="card"><h2>PLAYER MODE</h2><p class="muted">한 선수를 선택해 훈련 방향을 잡되, 모든 선수는 시즌을 거치며 함께 성장합니다.</p><div class="player-grid">${S.players.map(p=>`<button class="player-card ${p.id===S.selectedPlayer?'selected':''}" onclick="S.selectedPlayer=${p.id};save();render()"><div class="${raceClass(p.race)}">${RACE_LABEL[p.race]}</div><strong>${p.name}</strong><div class="muted small">종합 ${Math.round(avg(p))} · ${p.agePhase}</div></button>`).join('')}</div></div>
<div class="grid"><div class="card"><h3>${sel.name} 시즌 설정</h3><div class="statline"><span>시즌 훈련</span><select class="select" onchange="S.training=this.value;save()"><option value="balanced" ${S.training==='balanced'?'selected':''}>⚖️ 균형 훈련</option><option value="attack" ${S.training==='attack'?'selected':''}>⚔️ 피지컬·공격 훈련</option><option value="analysis" ${S.training==='analysis'?'selected':''}>🧠 분석 훈련</option><option value="macro" ${S.training==='macro'?'selected':''}>🛡️ 운영 훈련</option><option value="stable" ${S.training==='stable'?'selected':''}>🎯 안정성 훈련</option></select></div><div class="statline"><span>추천 전략 자동 선택</span><button class="btn ${S.autoStrategy?'good':'ghost'}" onclick="S.autoStrategy=!S.autoStrategy;save();render()">${S.autoStrategy?'ON':'OFF'}</button></div><button class="btn primary" onclick="quickAction()">${S.phase==='ready'?'시즌 시작':S.phase==='done'?'다음 시즌 시작':'경기 센터로'}</button></div>
<div class="card"><h3>v22 포인트 구조</h3><div class="statline"><span>정규리그</span><strong>1위 16P → 16위 1P</strong></div><div class="statline"><span>순위결정전</span><strong>1위 16P → 16위 1P</strong></div><div class="notice small">두 포인트는 별도 누적하고 <b>통산 종합P = 리그P + 순위결정전P</b>로 계산합니다.</div><h3 style="margin-top:16px">데이터 관리</h3><div class="data-actions"><button class="btn" onclick="save();toast('현재 상태를 저장했습니다')">💾 저장</button><button class="btn ghost" onclick="exportSave()">⬇️ 내보내기</button><button class="btn ghost" onclick="document.getElementById('importFile').click()">⬆️ 불러오기</button><button class="btn bad" onclick="resetAll()">초기화</button></div></div></div></div>
${S.phase==='league'?`<div class="card" style="margin-top:14px"><h3>현재 선두</h3><div class="row">${st.slice(0,4).map((p,i)=>`<span class="pill ${i===0?'warn':''}">${i+1}위 ${p.name} ${p.season.w}승 ${p.season.l}패</span>`).join('')}</div><div class="small muted" style="margin-top:10px">${sel.name} · 현재 ${rankNow(sel.id)}위 · ${rankZone(rankNow(sel.id))}</div></div><div class="card" style="margin-top:14px"><h3>🎯 ${sel.name} 시즌 목표</h3><div class="row">${seasonGoals(sel).map(g=>`<span class="pill ${g.ok?'good':''}">${g.ok?'✅':'○'} ${g.t}</span>`).join('')}</div></div>`:''}`}
function rankNow(id){let st=standings(),i=st.findIndex(p=>p.id===id);return i>=0?i+1:'-'}
function recentText(p){let r=(p.season.recent||[]);return r.length?r.map(x=>x==='W'?'승':'패').join(' · '):'기록 없음'}
function formText(p){let r=p.season.recent||[],w=r.filter(x=>x==='W').length;if(p.season.streak>=3)return '🔥 절정';if(w>=4)return '↑ 상승';if(p.season.streak<=-3)return '🧊 부진';if(r.length>=4&&w<=1)return '↓ 하락';return '→ 보통'}
function playerMatchMeta(p){let n=p.career.wins+p.career.losses,sd=p.season.setsW-p.season.setsL;return`<div class="fighter-meta"><h4>${p.name} 현재 정보</h4><div class="meta-grid"><div class="meta-chip"><span class="k">현재 순위</span><span class="v">${rankNow(p.id)}위</span></div><div class="meta-chip"><span class="k">시즌 전적</span><span class="v">${p.season.w}승 ${p.season.l}패</span></div><div class="meta-chip"><span class="k">세트 득실</span><span class="v">${sd>0?'+':''}${sd}</span></div><div class="meta-chip"><span class="k">폼</span><span class="v">${formText(p)}</span></div></div><div class="small muted" style="margin-top:8px">최근 ${recentText(p)} · 통산 ${p.career.wins}승 ${p.career.losses}패${n?` (${pct(p.career.wins/n)})`:''}</div></div>`}
function isBigMatch(e){let ra=rankNow(e.a.id),rb=rankNow(e.b.id),rel=relation(e.a.id,e.b.id);return !!rel||(ra<=4&&rb<=4)||e.label.includes('플레이오프')||e.label==='결승전'}
function renderMatch(){let e=currentExpected(),el=document.getElementById('tab-match');if(!e){el.innerHTML=`<div class="card"><h2>경기 센터</h2><p class="muted">${S.phase==='ready'?'시즌을 시작하면 첫 대진이 생성됩니다.':S.phase==='done'?'시즌이 종료되었습니다. 다음 시즌을 시작해 주세요.':'대진을 준비하고 있습니다.'}</p><button class="btn primary" onclick="quickAction()">${S.phase==='done'?'다음 시즌 시작':'시즌 시작'}</button></div>`;return}let rel=relation(e.a.id,e.b.id),map=MAPS[0],sa=strategyFor(e.a,map,e.b),sb=strategyFor(e.b,map,e.a),h=h2h(e.a.id,e.b.id),ha=e.a.id===h.a?h.aw:h.bw,hb=e.a.id===h.a?h.bw:h.aw,m=S.activeSeries&&S.activeSeries.a===e.a.id&&S.activeSeries.b===e.b.id?S.activeSeries:null,big=isBigMatch(e);let score=m?`${m.aw} : ${m.bw}`:`${Math.round(e.p*100)}% : ${Math.round((1-e.p)*100)}%`;el.innerHTML=`<div class="card ${big?'bigmatch':''}"><div class="row"><span class="pill">${e.label}</span><span class="pill">${e.bestOf}전 ${Math.ceil(e.bestOf/2)}선승</span>${big?'<span class="pill warn">🔥 BIG MATCH</span>':''}${rel?`<span class="pill ${rel.type==='라이벌'?'warn':'bad'}">${rel.type==='라이벌'?'⚔️ 라이벌 매치':'🎯 천적 관계'}</span>`:''}</div><div class="scorebox"><div><div class="${raceClass(e.a.race)}">${RACE_LABEL[e.a.race]}</div><div class="player-name">${e.a.name}</div><div class="muted small">${formText(e.a)}</div></div><div><div class="score">${score}</div><div class="vs">${m?'현재 세트 스코어':'예상 승률'}</div></div><div><div class="${raceClass(e.b.race)}">${RACE_LABEL[e.b.race]}</div><div class="player-name">${e.b.name}</div><div class="muted small">${formText(e.b)}</div></div></div><div class="match-meta">${playerMatchMeta(e.a)}${playerMatchMeta(e.b)}</div><div class="notice"><strong>⚔️ 현재 상대전적 ${e.a.name} ${ha} : ${hb} ${e.b.name}</strong><div class="small muted">중요 경기 맞대결 ${h.important}회 · 현재 순위 ${rankNow(e.a.id)}위 vs ${rankNow(e.b.id)}위</div></div>${m&&m.sets.length?`<div class="set-track">${m.sets.map(s=>`<div class="set-dot ${s.winner===e.a.id?'win':'loss'}"><b>${s.no}세트</b><div class="small">${pById(s.winner).name} 승</div><div class="small muted">${s.map}</div></div>`).join('')}</div>`:''}<div class="grid two" style="margin-top:12px"><div class="notice"><strong>추천 전략 · ${e.a.name}</strong><div>${sa.name}</div><div class="small muted">${sa.reason}</div></div><div class="notice"><strong>추천 전략 · ${e.b.name}</strong><div>${sb.name}</div><div class="small muted">${sb.reason}</div></div></div><div class="match-actions"><button class="btn primary" onclick="playOneSet()">▶ ${m?m.sets.length+1:1}세트 진행</button><button class="btn" onclick="quickAction()">▶ 경기 끝까지</button><button class="btn good" onclick="advanceToMyMatch()" ${isSelectedMatch(e.a.id,e.b.id)?'disabled':''}>${isSelectedMatch(e.a.id,e.b.id)?'⭐ 현재가 내 경기':'⭐ 내 경기까지'}</button><button class="btn ghost" onclick="openPlayer(${e.a.id})">${e.a.name} 상세</button><button class="btn ghost" onclick="openPlayer(${e.b.id})">${e.b.name} 상세</button></div></div>`}
function renderLeague(){let st=standings();document.getElementById('tab-league').innerHTML=`<div class="section-title"><h2>📋 전체 풀리그</h2><span class="pill">3전 2선승 · 15경기/인</span></div><div class="table-wrap"><table><thead><tr><th>순위</th><th>선수</th><th>종족</th><th>승</th><th>패</th><th>세트득실</th><th>연속</th><th>리그P</th></tr></thead><tbody>${st.map((p,i)=>`<tr><td class="${i<3?'rank'+(i+1):''}">${i+1}</td><td><button class="btn ghost" style="padding:5px 8px" onclick="openPlayer(${p.id})">${p.name}</button><div class="small muted">${rankZone(i+1)}</div></td><td>${RACE_LABEL[p.race]}</td><td>${p.season.w}</td><td>${p.season.l}</td><td>${p.season.setsW-p.season.setsL>0?'+':''}${p.season.setsW-p.season.setsL}</td><td>${p.season.streak>0?'🔥 '+p.season.streak:p.season.streak<0?'🧊 '+Math.abs(p.season.streak):'-'}</td><td>${p.season.leagueRank?p.season.leagueP:'예정'}</td></tr>`).join('')}</tbody></table></div><div class="notice small" style="margin-top:10px">정규리그 종료 시 1위 16P부터 16위 1P까지 1점 차등 지급됩니다.</div>`}
function renderPlayoff(){let el=document.getElementById('tab-playoff');if(!S.playoff){el.innerHTML=`<div class="card"><h2>🏟️ 순위결정전</h2><p class="muted">정규리그 종료 후 16위 vs 15위부터 시작합니다. 승자는 한 단계 위 선수를 계속 상대합니다.</p><div class="ladder">${Array.from({length:16},(_,i)=>`<div class="ladder-step"><div class="seed">${16-i}위</div><strong>${16-i===3?'준플레이오프':16-i===2?'플레이오프':16-i===1?'결승전':'순위결정'}</strong></div>`).join('')}</div></div>`;return}let info=playoffMatchInfo();el.innerHTML=`<div class="section-title"><h2>🏟️ 순위결정전</h2><span class="pill">${S.playoff.matches.length}경기 완료</span></div><div class="ladder">${S.playoff.seeds.slice().reverse().map((id,i)=>{let p=pById(id),rank=16-i,done=p.season.playoffRank!=null;return`<div class="ladder-step ${done?'done':''} ${info&&(info.a.id===id||info.b.id===id)?'current':''}"><div class="seed">정규리그 ${rank}위</div><strong>${p.name}</strong><div class="small muted">${done?'최종 '+p.season.playoffRank+'위':p.season.fatigue?`피로 ${p.season.fatigue.toFixed(1)}`:'대기'}</div></div>`}).join('')}</div>${info?`<div class="card"><div class="row"><span class="pill warn">${info.label}</span><span class="pill">${info.bestOf}전 ${Math.ceil(info.bestOf/2)}선승</span></div><div class="scorebox"><div class="player-name">${info.a.name}</div><div class="vs">VS</div><div class="player-name">${info.b.name}</div></div><div class="row"><button class="btn primary" onclick="playPlayoff()">${info.label} 진행</button><span class="pill">${info.a.name} 피로 ${info.a.season.fatigue.toFixed(1)}</span><span class="pill">${info.b.name} 피로 ${info.b.season.fatigue.toFixed(1)}</span></div></div>`:`<div class="card champ"><h2>👑 ${pById(S.playoff.champion).name} 우승</h2><p>순위결정전이 종료되었습니다.</p></div>`}<div class="card" style="margin-top:14px"><h3>순위결정전 포인트</h3><div class="small muted">1위 16 · 2위 15 · 3위 14 · … · 16위 1</div></div>`}
function renderGrowth(){let sel=pById(S.selectedPlayer);document.getElementById('tab-growth').innerHTML=`<div class="grid two"><div class="card"><h2>📈 성장 센터</h2><p class="muted">원본 능력치와 현재 능력치를 분리 저장합니다. 잠재력은 능력별 최대 1000이며 성장·전성기·노쇠화는 현재 능력치에만 적용됩니다.</p><div class="player-grid">${S.players.map(p=>`<button class="player-card ${p.id===sel.id?'selected':''}" onclick="S.selectedPlayer=${p.id};save();render()"><strong>${p.name}</strong><div class="small muted">${p.agePhase} · ${Math.round(avg(p))}</div></button>`).join('')}</div></div><div class="card"><h3>${sel.name} 능력치</h3>${STAT_KEYS.map(k=>`<div class="meter"><span>${STAT_LABEL[k]}</span><div class="track"><div class="fill" style="width:${sel.stats[k]/10}%"></div></div><b>${sel.stats[k]}</b></div><div class="small muted" style="margin:-3px 0 6px 71px">원본 ${sel.baseStats[k]} · 잠재 ${sel.potential[k]}</div>`).join('')}<div class="row" style="margin-top:12px"><span class="pill">성장 단계 ${sel.agePhase}</span><span class="pill">현재 평균 ${Math.round(avg(sel))}</span><span class="pill">원본 평균 ${Math.round(STAT_KEYS.reduce((a,k)=>a+sel.baseStats[k],0)/STAT_KEYS.length)}</span></div><h3 style="margin-top:16px">최근 성장 이유</h3>${sel.growthReason.length?sel.growthReason.map(x=>`<div class="story"><span>${x}</span></div>`).join(''):`<p class="muted small">시즌 결산 후 성장 내역이 표시됩니다.</p>`}<h3>시즌별 성장 이력</h3><div class="growth-history">${(sel.growthHistory||[]).length?[...sel.growthHistory].reverse().map(h=>`<div class="statline"><span>시즌 ${h.season} · ${h.phase}</span><strong class="${h.delta>=0?'trend-up':'trend-down'}">${h.before} → ${h.after} (${h.delta>=0?'+':''}${h.delta})</strong></div>`).join(''):'<p class="muted small">아직 성장 이력이 없습니다.</p>'}</div></div></div>`}
function renderRanking(){let ps=[...S.players].sort((a,b)=>totalP(b)-totalP(a)||b.career.titles-a.career.titles),pr=powerRanking();document.getElementById('tab-ranking').innerHTML=`<div class="grid two"><div><div class="section-title"><h2>🏆 역대 랭킹</h2><span class="pill">리그P + 순위결정전P</span></div><div class="table-wrap"><table><thead><tr><th>순위</th><th>선수</th><th>리그P</th><th>순위결정전P</th><th>총P</th><th>우승</th><th>정규1위</th><th>MVP</th><th>등급</th><th>통산 승률</th></tr></thead><tbody>${ps.map((p,i)=>{let n=p.career.wins+p.career.losses,g=careerGrade(p);return`<tr><td class="${i<3?'rank'+(i+1):''}">${i+1}</td><td><button class="btn ghost" style="padding:5px 8px" onclick="openPlayer(${p.id})">${p.name}</button></td><td>${p.career.leagueP}</td><td>${p.career.playoffP}</td><td><b>${totalP(p)}</b></td><td>${p.career.titles}</td><td>${p.career.leagueFirsts||0}</td><td>${p.career.mvp}</td><td><span class="grade ${g}">${g}</span></td><td>${n?pct(p.career.wins/n):'-'}</td></tr>`}).join('')}</tbody></table></div></div><div><div class="section-title"><h2>⚡ 파워랭킹</h2><span class="pill">최근 5경기 + 세트득실 + 흐름</span></div><div class="power-list">${pr.map((p,i)=>{let old=S.powerBaseline[p.id]||i+1,d=old-(i+1),t=d>0?`▲${d}`:d<0?`▼${Math.abs(d)}`:'-';return`<div class="power-row"><div class="prank">${i+1}</div><button class="btn ghost" style="text-align:left;padding:6px 8px" onclick="openPlayer(${p.id})">${p.name}</button><div class="${d>0?'trend-up':d<0?'trend-down':''}">${t}</div><div class="pscore small muted">${Math.round(powerScore(p))}</div></div>`}).join('')}</div></div></div>`}
function renderStory(){document.getElementById('tab-story').innerHTML=`<div class="section-title"><h2>📰 시즌 ${S.seasonNo} 스토리</h2><span class="pill">핵심 사건 자동 기록</span></div><div class="grid two"><div>${S.seasonStories.length?S.seasonStories.slice(0,12).map(x=>`<div class="story"><strong>${x.icon} ${x.title}</strong><span class="muted small">${x.text}</span></div>`).join(''):`<div class="card"><p class="muted">시즌을 진행하면 연승, 슬럼프, 라이벌, 천적, 대이변, 미라클런이 자동 기록됩니다.</p></div>`}</div><div class="card"><h3>💥 시즌 최고의 이변 TOP 5</h3>${S.upsets.length?S.upsets.slice(0,5).map((u,i)=>`<div class="statline"><span>${i+1}. <b>${pById(u.winner).name}</b> → ${pById(u.loser).name}</span><strong>${u.score}점</strong></div>`).join(''):'<p class="muted small">아직 업셋 경기가 없습니다.</p>'}</div></div>`}
function goatScore(p){return totalP(p)+p.career.titles*18+p.career.runnerups*7+(p.career.leagueFirsts||0)*6+p.career.mvp*8+p.career.awards*2}
function careerGrade(p){let g=goatScore(p);return g>=300?'GOAT':g>=210?'Legend':g>=140?'All-Star':g>=90?'Elite':g>=45?'Star':'Challenger'}
function rivalRows(){let out=[];Object.values(S.head2head).forEach(h=>{let n=h.aw+h.bw;if(n<5)return;let a=pById(h.a),b=pById(h.b),r=relation(a.id,b.id);if(r)out.push({a,b,h,r,n})});return out.sort((x,y)=>y.n-x.n)}
function renderRecords(){let goat=[...S.players].sort((a,b)=>goatScore(b)-goatScore(a)),rels=rivalRows(),mostWins=[...S.players].sort((a,b)=>b.career.wins-a.career.wins),bestRate=[...S.players].filter(p=>p.career.wins+p.career.losses>=10).sort((a,b)=>b.career.wins/(b.career.wins+b.career.losses)-a.career.wins/(a.career.wins+a.career.losses));document.getElementById('tab-records').innerHTML=`<div class="grid two"><div class="card"><h2>🌟 명예의 전당 · GOAT</h2>${goat.slice(0,8).map((p,i)=>{let g=careerGrade(p);return`<div class="statline"><span>${i+1}. <b>${p.name}</b> <span class="grade ${g}">${g}</span></span><span>${goatScore(p)}점</span></div>`}).join('')}<p class="small muted">종합P, 우승, 정규리그 1위, 준우승, MVP와 시즌 어워드를 종합합니다.</p></div><div class="card"><h2>⚔️ 라이벌 · 천적</h2>${rels.length?rels.slice(0,10).map(x=>`<div class="story"><strong>${x.r.type==='라이벌'?'⚔️':'🎯'} ${x.a.name} vs ${x.b.name}</strong><span class="small muted">${x.r.type} · 상대전적 ${x.h.aw}:${x.h.bw} · 중요경기 ${x.h.important}회</span></div>`).join(''):`<p class="muted">맞대결이 쌓이면 자동 생성됩니다.</p>`}</div></div><div class="award-grid" style="margin-top:14px"><div class="award"><div class="icon">🏆</div><b>최다 우승</b><div>${goat.slice().sort((a,b)=>b.career.titles-a.career.titles)[0].name} · ${goat.slice().sort((a,b)=>b.career.titles-a.career.titles)[0].career.titles}회</div></div><div class="award"><div class="icon">👑</div><b>정규리그 1위</b><div>${goat.slice().sort((a,b)=>(b.career.leagueFirsts||0)-(a.career.leagueFirsts||0))[0].name} · ${goat.slice().sort((a,b)=>(b.career.leagueFirsts||0)-(a.career.leagueFirsts||0))[0].career.leagueFirsts||0}회</div></div><div class="award"><div class="icon">⚔️</div><b>통산 최다승</b><div>${mostWins[0].name} · ${mostWins[0].career.wins}승</div></div><div class="award"><div class="icon">🎯</div><b>통산 최고 승률</b><div>${bestRate[0]?bestRate[0].name+' · '+pct(bestRate[0].career.wins/(bestRate[0].career.wins+bestRate[0].career.losses)):'기록 부족'}</div></div><div class="award"><div class="icon">⭐</div><b>최다 MVP</b><div>${goat.slice().sort((a,b)=>b.career.mvp-a.career.mvp)[0].name} · ${goat.slice().sort((a,b)=>b.career.mvp-a.career.mvp)[0].career.mvp}회</div></div><div class="award"><div class="icon">🔥</div><b>현재 시대</b><div>${eraText()}</div></div></div>`}
function renderSeasons(){document.getElementById('tab-seasons').innerHTML=`<div class="section-title"><h2>🗓️ 역대 시즌</h2><span class="pill">${S.seasons.length}시즌 완료</span></div>${S.seasons.length?[...S.seasons].reverse().map(s=>`<div class="card" style="margin-bottom:10px"><div class="statline"><div><span class="pill warn">시즌 ${s.no}</span> <strong>${pById(s.champion).name} 우승</strong></div><button class="btn ghost" onclick="openSeason(${s.no})">상세</button></div><div class="small muted">정규리그 1위 ${s.leagueWinner!=null?pById(s.leagueWinner).name:'-'} · 준우승 ${s.runnerup!=null?pById(s.runnerup).name:'-'} · ${s.era}</div></div>`).join(''):`<div class="card"><p class="muted">완료된 시즌이 없습니다.</p></div>`}`}
function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modalWrap').classList.add('show')}
function closeModal(){document.getElementById('modalWrap').classList.remove('show')}
function openPlayer(id){let p=pById(id),rels=S.players.filter(x=>x.id!==id).map(x=>({x,r:relation(id,x.id),h:h2h(id,x.id)})).filter(o=>o.r),all=S.players.filter(x=>x.id!==id).map(x=>{let h=h2h(id,x.id),w=id===h.a?h.aw:h.bw,l=id===h.a?h.bw:h.aw;return{x,w,l,n:w+l}}).filter(o=>o.n>=3),nem=[...all].sort((a,b)=>(b.l-b.w)-(a.l-a.w))[0],prey=[...all].sort((a,b)=>(b.w-b.l)-(a.w-a.l))[0],g=careerGrade(p);openModal(`${p.name} 상세`, `<div class="summary-list"><div class="mini"><div class="label">현재 종합</div><div class="value">${Math.round(avg(p))}</div></div><div class="mini"><div class="label">통산 종합P</div><div class="value">${totalP(p)}</div></div><div class="mini"><div class="label">리그P / 결정전P</div><div class="value" style="font-size:17px">${p.career.leagueP} / ${p.career.playoffP}</div></div><div class="mini"><div class="label">커리어 등급</div><div class="value grade ${g}" style="font-size:17px">${g}</div></div></div><div class="row" style="margin-top:12px"><span class="pill warn">🏆 우승 ${p.career.titles}</span><span class="pill">👑 정규 1위 ${p.career.leagueFirsts||0}</span><span class="pill">🥈 준우승 ${p.career.runnerups}</span><span class="pill">⭐ MVP ${p.career.mvp}</span></div><h3>능력치</h3>${STAT_KEYS.map(k=>`<div class="meter"><span>${STAT_LABEL[k]}</span><div class="track"><div class="fill" style="width:${p.stats[k]/10}%"></div></div><b>${p.stats[k]}</b></div>`).join('')}<h3>현재 시즌</h3><div class="row"><span class="pill">리그 ${p.season.w}승 ${p.season.l}패</span><span class="pill">순위결정전 ${p.season.playoffW||0}승 ${p.season.playoffL||0}패</span><span class="pill">리그P ${p.season.leagueP}</span><span class="pill">순위결정전P ${p.season.playoffP}</span>${p.season.streak>=3?`<span class="pill good">🔥 ${p.season.streak}연승</span>`:''}</div><h3>천적 / 강한 상대</h3><div class="row"><span class="pill bad">천적 ${nem?nem.x.name+` (${nem.w}승 ${nem.l}패)`:'기록 부족'}</span><span class="pill good">강한 상대 ${prey?prey.x.name+` (${prey.w}승 ${prey.l}패)`:'기록 부족'}</span></div><h3>라이벌 관계</h3>${rels.length?rels.map(o=>`<div class="story"><strong>${o.r.type==='라이벌'?'⚔️':'🎯'} ${o.x.name} · ${o.r.type}</strong><span class="small muted">상대전적 ${id===o.h.a?o.h.aw:o.h.bw}:${id===o.h.a?o.h.bw:o.h.aw}</span></div>`).join(''):`<p class="muted small">아직 뚜렷한 라이벌 관계가 없습니다.</p>`}`)}
function openLastMatch(){let m=S.lastMatch;if(!m)return toast('아직 경기 결과가 없습니다');let a=pById(m.a),b=pById(m.b),w=pById(m.winner);openModal(`${m.label} · ${w.name} 승리`,`<div class="scorebox"><div class="player-name">${a.name}</div><div class="score">${m.aw} : ${m.bw}</div><div class="player-name">${b.name}</div></div>${m.sets.map(s=>`<div class="story"><strong>${s.no}세트 · ${s.map} (${s.mapType})</strong><span class="small">${a.name} ${RACE_LABEL[s.aRace]} · ${s.aStrategy} / ${b.name} ${RACE_LABEL[s.bRace]} · ${s.bStrategy}</span><span class="small muted"> · 승자 ${pById(s.winner).name}</span></div>`).join('')}${m.upset?'<div class="notice">💥 사전 기대승률 30% 이하를 뒤집은 대이변 경기입니다.</div>':''}`)}
function openSeason(no){let s=S.seasons.find(x=>x.no===no);if(!s)return;let rows=s.finalRanks?s.finalRanks.map((id,i)=>{let x=s.points.find(y=>y.id===id);return{...x,rank:i+1}}):[...s.points].sort((a,b)=>(b.l+b.p)-(a.l+a.p)).map((x,i)=>({...x,rank:i+1}));openModal(`시즌 ${no} 결산`,`<div class="summary-list"><div class="mini"><div class="label">정규리그 1위</div><div class="value" style="font-size:17px">${s.leagueWinner!=null?pById(s.leagueWinner).name:'-'}</div></div><div class="mini"><div class="label">시즌 우승</div><div class="value" style="font-size:17px">${pById(s.champion).name}</div></div><div class="mini"><div class="label">준우승</div><div class="value" style="font-size:17px">${s.runnerup!=null?pById(s.runnerup).name:'-'}</div></div><div class="mini"><div class="label">시대</div><div class="value" style="font-size:14px">${s.era}</div></div></div><h3>최종 순위 · 포인트</h3><div class="table-wrap"><table><thead><tr><th>최종</th><th>선수</th><th>리그P</th><th>순위결정전P</th><th>합계</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.rank}</td><td>${pById(x.id).name}</td><td>${x.l}</td><td>${x.p}</td><td><b>${x.l+x.p}</b></td></tr>`).join('')}</tbody></table></div><h3>🏅 시즌 어워드</h3><div class="award-grid">${(s.awards||[]).map(a=>`<div class="award"><div class="icon">${a.icon||'🏅'}</div><b>${a.t}</b><div>${pById(a.p).name}</div>${a.v?`<div class="small muted">${a.v}</div>`:''}</div>`).join('')}</div><h3>📰 시즌 스토리</h3>${(s.stories||[]).slice(0,5).map(x=>`<div class="story"><strong>${x.icon} ${x.title}</strong><span class="small muted">${x.text}</span></div>`).join('')}`)}
function render(){renderNav();renderHome();renderMatch();renderLeague();renderPlayoff();renderGrowth();renderRanking();renderStory();renderRecords();renderSeasons();document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById('tab-'+S.activeTab).classList.add('active');updateQuick();if(S.lastMatch)showResult(S.lastMatch)}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script>
</body>
</html>
