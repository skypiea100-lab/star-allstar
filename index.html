<style>

*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#07101d,#0b1324 42%,#08101f);color:var(--text);font-family:Inter,Pretendard,"Noto Sans KR",system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.45;padding-bottom:88px}

.grid{display:grid;gap:14px}.grid.two{grid-template-columns:1.1fr .9fr}.grid.three{grid-template-columns:repeat(3,1fr)}.card{background:linear-gradient(180deg,rgba(20,33,57,.96),rgba(13,24,43,.96));border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 10px}.muted{color:var(--muted)}.small{font-size:12px}.big{font-size:28px;font-weight:900}.statline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0}.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:#0b1427;padding:5px 8px;border-radius:999px;font-size:12px;color:#c9d5eb}.pill.good{color:#b9f8dc;border-color:#2c6d59}.pill.warn{color:#ffe59a;border-color:#68582a}.pill.bad{color:#ffc0cb;border-color:#713341}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid #36527f;background:#18345e;color:#f7fbff;padding:10px 13px;border-radius:12px;font-weight:800}.btn:hover{filter:brightness(1.1)}.btn.primary{background:#e6efff;color:#07142c;border-color:#e6efff}.btn.good{background:#164b3c;border-color:#2e8067}.btn.bad{background:#552334;border-color:#864057}.btn.ghost{background:transparent;border-color:var(--line)}.btn:disabled{opacity:.45;cursor:not-allowed}.select{background:#0c1629;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:10px;max-width:100%}
.tab{display:none}.tab.active{display:block}.scorebox{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;text-align:center;padding:18px 0}.player-name{font-weight:900;font-size:clamp(18px,3vw,28px)}.score{font-size:34px;font-weight:950;letter-spacing:.05em}.vs{font-size:12px;color:var(--muted);font-weight:900}.progress{height:8px;background:#071020;border:1px solid #24334e;border-radius:99px;overflow:hidden}.progress>span{display:block;height:100%;background:linear-gradient(90deg,#7aaaff,#7ee2c4)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:650px;background:#0d172a}th,td{padding:10px 12px;border-bottom:1px solid #22314d;text-align:right;white-space:nowrap}th{font-size:12px;color:#b9c8e1;background:#121f36;position:sticky;top:0}th:nth-child(2),td:nth-child(2){text-align:left}.rank1{color:#ffe18a;font-weight:900}.rank2{color:#d8e2f4}.rank3{color:#e1b58a}.trend-up{color:var(--good)}.trend-down{color:var(--bad)}
.player-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.player-card{border:1px solid var(--line);background:#0d172a;border-radius:14px;padding:12px;text-align:left;color:var(--text)}.player-card:hover{border-color:#6d9bea}.player-card.selected{background:#dfeaff;color:#09152a;border-color:#dfeaff}.player-card.selected .muted{color:#40506b}.race{font-size:11px;font-weight:900;letter-spacing:.05em}.race.T{color:#7ec8ff}.race.Z{color:#d895ff}.race.P{color:#ffe083}.race.R{color:#a7f3d0}.player-card.selected .race{color:#20385f}.meter{display:grid;grid-template-columns:64px 1fr 44px;gap:7px;align-items:center;margin:7px 0;font-size:12px}.meter .track{height:7px;background:#071020;border-radius:9px;overflow:hidden}.meter .fill{height:100%;background:#87aef8;border-radius:9px}.story{border-left:3px solid #4d75b4;padding:9px 12px;margin:8px 0;background:#0c1628;border-radius:0 12px 12px 0}.story strong{display:block}.section-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0 10px}.section-title h2{margin:0}.summary-list{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mini{background:#0d172a;border:1px solid var(--line);border-radius:13px;padding:12px}.mini .label{font-size:11px;color:var(--muted)}.mini .value{font-size:20px;font-weight:900;margin-top:3px}.ladder{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.ladder-step{flex:0 0 110px;border:1px solid var(--line);background:#0d172a;border-radius:12px;padding:10px}.ladder-step.done{border-color:#3c6a5b}.ladder-step.current{border-color:#8db6ff;box-shadow:0 0 0 2px rgba(141,182,255,.15)}.ladder-step .seed{font-size:11px;color:var(--muted)}
.modal-wrap{position:fixed;inset:0;z-index:100;display:none;background:rgba(2,7,16,.75);padding:18px;align-items:center;justify-content:center}.modal-wrap.show{display:flex}.modal{width:min(720px,100%);max-height:86vh;overflow:auto;background:#111d32;border:1px solid #33496d;border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.5)}.modal-head{position:sticky;top:0;background:#111d32;display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line);z-index:1}.modal-body{padding:16px}.close{border:0;background:#263652;color:#fff;width:34px;height:34px;border-radius:50%;font-size:20px}.toast{position:fixed;right:14px;bottom:90px;z-index:120;background:#eaf1ff;color:#07142c;border-radius:12px;padding:10px 13px;font-weight:800;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);pointer-events:none;transition:.22s}.toast.show{opacity:1;transform:none}.bottom-actions{position:fixed;z-index:55;left:0;right:0;bottom:0;background:rgba(6,13,26,.92);backdrop-filter:blur(16px);border-top:1px solid #283957;padding:9px max(10px,env(safe-area-inset-right)) calc(9px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:flex;justify-content:center;gap:8px}.bottom-actions .btn{min-width:130px}.notice{border:1px dashed #405579;background:#0a1427;border-radius:14px;padding:12px}.champ{background:linear-gradient(135deg,#3c3215,#171c2d);border-color:#7d6a2f}.hidden{display:none!important}
@media(max-width:850px){.grid.two,.grid.three{grid-template-columns:1fr}.player-grid{grid-template-columns:repeat(2,1fr)}.summary-list{grid-template-columns:repeat(2,1fr)}.app{padding:12px}.hero{padding-top:14px}.card{border-radius:16px;padding:13px}.topbar{top:0}.result-actions .btn{padding:8px 10px}.result-sub{display:none}}

<body>
<div class="topbar">
  <div id="resultBanner" class="result-banner">

<div class="app">
  <header class="hero"><div class="kicker">STARCRAFT LEAGUE · v20 · iPHONE COMPATIBLE</div><h1>스타 올스타 리그 <span style="color:#8ab5ff">v20</span></h1><p>16인 풀리그와 스텝래더 순위결정전. 이제 정규리그와 순위결정전 포인트가 따로 쌓이고, 매 시즌 라이벌·대이변·왕조와 이야기가 남습니다.</p></header>

  <section id="tab-home" class="tab active"></section>

<div class="bottom-actions"><button class="btn ghost" onclick="scrollTo({top:0,behavior:'smooth'})">↑ 맨 위</button><button id="quickBtn" class="btn primary" onclick="quickAction()">경기 진행</button></div>
<div id="modalWrap" class="modal-wrap" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><strong id="modalTitle">상세</strong><button class="close" onclick="closeModal()">×</button></div><div id="modalBody" class="modal-body"></div></div></div>
<div id="toast" class="toast"></div>
<script>
const V='20.1';
const STORAGE='star_allstar_v20_iphone_state';
let storageAvailable=true;
const STAT_KEYS=['control','attack','defense','macro','strategy','scout','harass','sense'];
const STAT_LABEL={control:'컨트롤',attack:'공격력',defense:'수비력',macro:'물량',strategy:'전략',scout:'정찰',harass:'견제',sense:'경기 감각'};
const RACE_LABEL={T:'Terran',Z:'Zerg',P:'Protoss',R:'Random'};
const PLAYOFF_P={1:10,2:8,3:7,4:6,5:5,6:4,7:4,8:3,9:3,10:2,11:2,12:2,13:1,14:1,15:1,16:0};
const MAPS=[
{name:'네오 아카디아',type:'운영형',boost:'macro'},{name:'블루 스톰',type:'난전형',boost:'sense'},{name:'파이썬',type:'균형형',boost:'strategy'},{name:'투혼',type:'공격형',boost:'attack'},{name:'신 단장의 능선',type:'멀티형',boost:'macro'},{name:'데스티네이션',type:'견제형',boost:'harass'},{name:'카트리나',type:'장기전형',boost:'defense'}
];
const PLAYER_SEED=[
['박성덕','R',[538,536,538,532,542,536,528,540],[1000,1000,1000,1000,1000,1000,1000,1000]],
['이영호','T',[530,524,535,538,533,522,520,538],[980,965,985,990,985,965,960,995]],
['이윤열','T',[516,522,506,524,517,504,517,522],[965,975,950,980,970,945,970,980]],
['최연성','T',[517,528,517,530,505,496,508,519],[970,985,970,990,955,935,955,975]],
['임요환','T',[496,509,484,486,515,511,522,509],[955,970,930,945,985,980,995,975]],
['정명훈','T',[511,518,513,520,515,504,511,520],[960,970,965,975,970,950,960,980]],
['이제동','Z',[532,534,520,529,520,516,529,536],[985,990,970,980,975,965,985,995]],
['마재윤','Z',[514,518,518,524,529,518,520,527],[965,970,970,980,990,975,975,985]],
['박성준','Z',[517,529,497,508,495,490,515,513],[975,990,945,965,940,930,975,970]],
['홍진호','Z',[497,507,493,500,502,495,509,513],[955,970,945,955,960,945,970,980]],
['조용호','Z',[491,496,507,509,503,498,489,507],[945,955,970,975,965,955,945,970]],
['김택용','P',[529,526,508,517,528,523,537,532],[985,980,955,970,985,980,995,990]],
['강민','P',[501,506,497,504,531,524,520,513],[950,960,945,955,995,985,980,970]],
['송병구','P',[516,515,524,526,519,512,506,526],[970,965,980,985,975,960,950,985]],
['허영무','P',[508,511,516,511,509,502,505,518],[960,970,975,970,965,950,955,980]],
['박정석','P',[504,513,507,509,504,500,498,513],[955,970,960,965,955,945,945,975]]
];
const NAV=[['home','홈'],['match','경기 센터'],['league','풀리그'],['playoff','순위결정전'],['growth','성장 센터'],['ranking','역대 랭킹'],['story','시즌 스토리'],['records','기록실'],['seasons','역대 시즌']];
function freshPlayer(x,i){let stats={},pot={};STAT_KEYS.forEach((k,j)=>{stats[k]=x[2][j];pot[k]=x[3][j]});return{id:i,name:x[0],race:x[1],stats,potential:pot,agePhase:i===0?'전성기':['상승기','전성기','안정기'][i%3],career:{leagueP:0,playoffP:0,titles:0,runnerups:0,mvp:0,awards:0,wins:0,losses:0},season:{w:0,l:0,setsW:0,setsL:0,playoffW:0,playoffL:0,streak:0,maxStreak:0,fatigue:0,leagueRank:null,playoffRank:null,leagueP:0,playoffP:0,upsets:0},growthReason:[]}}
function newState(){return{version:V,seasonNo:1,phase:'ready',selectedPlayer:0,training:'balanced',goal:'auto',autoStrategy:true,players:PLAYER_SEED.map(freshPlayer),schedule:[],matchIndex:0,playoff:null,head2head:{},stories:[],seasonStories:[],seasons:[],lastMatch:null,activeTab:'home'}}
let S=load();
function load(){try{let x=JSON.parse(localStorage.getItem(STORAGE));if(x&&x.version===V)return x;if(x&&x.version==='20'&&Array.isArray(x.players)){x.players.forEach((p,i)=>{let seed=PLAYER_SEED[i];if(!p||!seed)return;STAT_KEYS.forEach((k,j)=>{p.stats[k]=seed[2][j];p.potential[k]=seed[3][j]});p.growthReason=['v20 성장형 초기 능력치로 복구']});x.version=V;return x}}catch(e){}return newState()}
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(S));storageAvailable=true}catch(e){storageAvailable=false}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function avg(p){return STAT_KEYS.reduce((a,k)=>a+p.stats[k],0)/STAT_KEYS.length}
function pById(id){return S.players.find(p=>p.id===id)}
function raceClass(r){return 'race '+r}
function pct(n){return Math.round(n*100)+'%'}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function story(icon,title,text){S.seasonStories.unshift({icon,title,text,ts:Date.now()});if(S.seasonStories.length>80)S.seasonStories.pop()}
function h2key(a,b){return a<b?`${a}-${b}`:`${b}-${a}`}
function h2h(a,b){let k=h2key(a,b);if(!S.head2head[k])S.head2head[k]={a:Math.min(a,b),b:Math.max(a,b),aw:0,bw:0,important:0};return S.head2head[k]}
function addH2H(w,l,important){let h=h2h(w,l);if(w===h.a)h.aw++;else h.bw++;if(important)h.important++}
function relation(a,b){let h=h2h(a,b),n=h.aw+h.bw;if(n<5)return null;let wa=(a===h.a?h.aw:h.bw),wb=n-wa,ratio=Math.max(wa,wb)/n;if(n>=6&&ratio>=.72){let dom=wa>wb?a:b;return{type:'천적',dom}}if(n>=6&&Math.abs(wa-wb)<=Math.max(2,Math.floor(n*.2))&&(h.important>=1||n>=8))return{type:'라이벌'};return null}
function phaseLabel(){return S.phase==='ready'?'시즌 준비':S.phase==='league'?'정규 풀리그':S.phase==='playoff'?'순위결정전':'시즌 종료'}
function makeSchedule(){let ids=S.players.map(p=>p.id),arr=[];for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)arr.push({a:ids[i],b:ids[j],played:false});return shuffle(arr)}
function resetSeasonStats(){S.players.forEach(p=>p.season={w:0,l:0,setsW:0,setsL:0,playoffW:0,playoffL:0,streak:0,maxStreak:0,fatigue:0,leagueRank:null,playoffRank:null,leagueP:0,playoffP:0,upsets:0})}
function startSeason(){if(S.phase!=='ready'&&S.phase!=='done')return;S.seasonNo+=(S.phase==='done'?1:0);resetSeasonStats();S.schedule=makeSchedule();S.matchIndex=0;S.playoff=null;S.seasonStories=[];S.lastMatch=null;S.phase='league';story('🎬',`시즌 ${S.seasonNo} 개막`,'16명의 선수가 15경기 풀리그를 시작했습니다.');save();render();goTab('match');toast('새 시즌이 시작되었습니다')}
function standings(){return [...S.players].sort((a,b)=>b.season.w-a.season.w||((b.season.setsW-b.season.setsL)-(a.season.setsW-a.season.setsL))||avg(b)-avg(a))}
function currentLeagueMatch(){while(S.matchIndex<S.schedule.length&&S.schedule[S.matchIndex].played)S.matchIndex++;return S.schedule[S.matchIndex]||null}
function strategyFor(p,map,opp){let choices=[['초반 압박','attack'],['운영 중심','macro'],['수비 후 역습','defense'],['견제 집중','harass'],['심리전·변칙','strategy']];let best=choices[0],bestScore=-1e9;choices.forEach(c=>{let score=p.stats[c[1]]+(map.boost===c[1]?24:0)+(p.stats[c[1]]-opp.stats[c[1]])*.15;if(score>bestScore){best=c;bestScore=score}});return{name:best[0],key:best[1],reason:`${STAT_LABEL[best[1]]} ${p.stats[best[1]]} · ${map.type}${map.boost===best[1]?' 보정':''}`}}
function formBonus(p){let s=p.season.streak;if(s>=3)return Math.min(3,(s-2)*.7);if(s<=-3)return -Math.min(3,(-s-2)*.7);return 0}
function winProb(a,b,map,isPlayoff=false){let ra=avg(a),rb=avg(b);let diff=(ra-rb)/45;diff+=(a.stats[map.boost]-b.stats[map.boost])/180;diff+=(formBonus(a)-formBonus(b))/100;if(isPlayoff)diff+=(-a.season.fatigue+b.season.fatigue)/180;return clamp(1/(1+Math.exp(-diff)),.12,.88)}
function randomRace(p){if(p.race!=='R')return p.race;return ['T','Z','P'][Math.floor(Math.random()*3)]}
function simulateSeries(a,b,bestOf,label,isPlayoff=false){let need=Math.ceil(bestOf/2),aw=0,bw=0,sets=[],baseMap=MAPS[Math.floor(Math.random()*MAPS.length)],pre=winProb(a,b,baseMap,isPlayoff);while(aw<need&&bw<need){let map=MAPS[Math.floor(Math.random()*MAPS.length)],pa=winProb(a,b,map,isPlayoff),sa=strategyFor(a,map,b),sb=strategyFor(b,map,a),winner=Math.random()<pa?a:b;if(winner.id===a.id)aw++;else bw++;sets.push({no:sets.length+1,map:map.name,mapType:map.type,aRace:randomRace(a),bRace:randomRace(b),aStrategy:sa.name,bStrategy:sb.name,probA:pa,winner:winner.id})}let winner=aw>bw?a:b,loser=winner.id===a.id?b:a,wp=winner.id===a.id?pre:1-pre;return{a:a.id,b:b.id,aw,bw,winner:winner.id,loser:loser.id,bestOf,label,sets,expectedA:pre,upset:wp<=.30,date:Date.now()}}
function applySeries(m,isPlayoff=false){let a=pById(m.a),b=pById(m.b),w=pById(m.winner),l=pById(m.loser);if(isPlayoff){w.season.playoffW++;l.season.playoffL++}else{a.season.setsW+=m.aw;a.season.setsL+=m.bw;b.season.setsW+=m.bw;b.season.setsL+=m.aw;w.season.w++;l.season.l++}w.career.wins++;l.career.losses++;w.season.streak=w.season.streak>0?w.season.streak+1:1;l.season.streak=l.season.streak<0?l.season.streak-1:-1;w.season.maxStreak=Math.max(w.season.maxStreak,w.season.streak);if(w.season.streak===3||w.season.streak===5||w.season.streak===8||w.season.streak===10)story('🔥',`${w.name} ${w.season.streak}연승`,`${m.label}에서 상승세를 이어갔습니다.`);if(l.season.streak===-5)story('🧊',`${l.name} 슬럼프`,`${Math.abs(l.season.streak)}연패에 빠졌습니다.`);let important=isPlayoff||m.label.includes('결승');addH2H(w.id,l.id,important);let rel=relation(w.id,l.id);if(rel?.type==='라이벌')story('⚔️',`${w.name} · ${l.name} 라이벌 구도`, '접전 상대전적과 중요 경기 맞대결이 쌓였습니다.');if(m.upset){w.season.upsets++;story('💥',`${w.name} 대이변!`,`${l.name}을 상대로 사전 승리 확률 ${Math.round((w.id===a.id?m.expectedA:1-m.expectedA)*100)}%를 뒤집었습니다.`)}S.lastMatch=m;showResult(m);if(isPlayoff)w.season.fatigue=Math.min(12,w.season.fatigue+1.6)}
function showResult(m){let w=pById(m.winner),l=pById(m.loser),score=w.id===m.a?`${m.aw}:${m.bw}`:`${m.bw}:${m.aw}`;let icon=m.label==='결승전'?'👑':m.upset?'💥':'🏆';document.getElementById('resultIcon').textContent=icon;document.getElementById('resultTitle').textContent=`${w.name} 승리!  ${score}  ${l.name}`;document.getElementById('resultSub').textContent=`${m.label} · ${m.bestOf}전 ${Math.ceil(m.bestOf/2)}선승${m.upset?' · 대이변':''}`;document.getElementById('resultBanner').classList.add('show')}
function playLeagueMatch(){if(S.phase!=='league')return;let sm=currentLeagueMatch();if(!sm){finishLeague();return}let a=pById(sm.a),b=pById(sm.b),m=simulateSeries(a,b,3,'정규리그',false);sm.played=true;sm.result=m;applySeries(m,false);S.matchIndex++;if(S.matchIndex>=S.schedule.length)finishLeague();save();render()}
function finishLeague(){let st=standings();st.forEach((p,i)=>{p.season.leagueRank=i+1;p.season.leagueP=16-i;p.career.leagueP+=16-i});story('📋','정규리그 종료',`${st[0].name}이 ${st[0].season.w}승 ${st[0].season.l}패로 정규리그 1위를 차지했습니다.`);S.phase='playoff';S.playoff={seeds:st.map(p=>p.id),challenger:st[15].id,nextSeedIndex:14,placement:16,finished:{},matches:[],champion:null};save();toast('정규리그 종료 · 순위결정전 시작')}
function playoffMatchInfo(){if(S.phase!=='playoff'||!S.playoff)return null;let po=S.playoff;if(po.nextSeedIndex<0)return null;let oppRank=po.nextSeedIndex+1,label=oppRank===3?'준플레이오프':oppRank===2?'플레이오프':oppRank===1?'결승전':`${oppRank}위 진입 순위결정전`;return{a:pById(po.challenger),b:pById(po.seeds[po.nextSeedIndex]),bestOf:oppRank===1?7:5,label,oppRank}}
function playPlayoff(){let info=playoffMatchInfo();if(!info)return;let m=simulateSeries(info.a,info.b,info.bestOf,info.label,true);applySeries(m,true);S.playoff.matches.push(m);let loser=pById(m.loser),winner=pById(m.winner);loser.season.playoffRank=S.playoff.placement;S.playoff.finished[loser.id]=S.playoff.placement;if(winner.id===S.playoff.challenger&&info.oppRank<=12&&S.playoff.matches.length>=4)story('🚀',`${winner.name} 미라클런`,`${S.playoff.matches.length}연속 순위결정전 승리로 ${info.oppRank}위권까지 올라왔습니다.`);S.playoff.challenger=winner.id;S.playoff.placement--;S.playoff.nextSeedIndex--;if(info.oppRank===1){winner.season.playoffRank=1;loser.season.playoffRank=2;S.playoff.finished[winner.id]=1;S.playoff.finished[loser.id]=2;S.playoff.champion=winner.id;finishSeason()}save();render()}
function growPlayers(){S.players.forEach((p,idx)=>{p.growthReason=[];let phase=p.agePhase;let base=phase==='상승기'?5:phase==='전성기'?2:phase==='안정기'?1:-2;STAT_KEYS.forEach(k=>{let d=base+Math.floor(Math.random()*5)-2;if(idx===S.selectedPlayer){if(S.training==='attack'&&['control','attack','sense'].includes(k))d+=3;if(S.training==='analysis'&&['strategy','scout','sense'].includes(k))d+=3;if(S.training==='macro'&&['macro','defense','sense'].includes(k))d+=3;if(S.training==='stable'&&['defense','scout','strategy'].includes(k))d+=3}let before=p.stats[k];p.stats[k]=clamp(p.stats[k]+d,350,p.potential[k]);let actual=p.stats[k]-before;if(actual!==0&&Math.random()<.28)p.growthReason.push(`${STAT_LABEL[k]} ${actual>0?'+':''}${actual} · ${actual>0?(p.season.w>=9?'시즌 경험 축적':'훈련·경기 경험'):'노쇠화 영향'}`)});if(p.growthReason.length===0)p.growthReason.push('능력치 유지 · 안정적인 시즌')})}
function awards(){let ps=[...S.players],mvp=[...ps].sort((a,b)=>((b.season.w+b.season.playoffW)*2+b.season.playoffP+b.season.upsets*2)-((a.season.w+a.season.playoffW)*2+a.season.playoffP+a.season.upsets*2))[0];let wins=[...ps].sort((a,b)=>(b.season.w+b.season.playoffW)-(a.season.w+a.season.playoffW))[0];let streak=[...ps].sort((a,b)=>b.season.maxStreak-a.season.maxStreak)[0];let upset=[...ps].sort((a,b)=>b.season.upsets-a.season.upsets)[0];mvp.career.mvp++;[mvp,wins,streak,upset].forEach(p=>p.career.awards++);return[{t:'시즌 MVP',p:mvp.id},{t:'다승왕',p:wins.id},{t:'최장 연승',p:streak.id,v:`${streak.season.maxStreak}연승`},{t:'이변상',p:upset.id,v:`${upset.season.upsets}회`} ]}
function eraText(){let hs=[...S.seasons.slice(-4),{champion:S.playoff?.champion}].filter(x=>x.champion!=null);if(hs.length<3)return '새로운 시대가 만들어지는 중';let c={};hs.forEach(x=>c[x.champion]=(c[x.champion]||0)+1);let [id,n]=Object.entries(c).sort((a,b)=>b[1]-a[1])[0];if(n>=4)return `👑 ${pById(+id).name} 절대왕조`;if(n>=3)return `👑 ${pById(+id).name} 왕조`;if(Object.keys(c).length===hs.length)return '⚔️ 춘추전국 시대';return `🔥 ${pById(+id).name} 중심의 경쟁 시대`}
function finishSeason(){S.players.forEach(p=>{if(!p.season.playoffRank){let rank=S.playoff.finished[p.id];if(rank)p.season.playoffRank=rank}p.season.playoffP=PLAYOFF_P[p.season.playoffRank]??0;p.career.playoffP+=p.season.playoffP});let champ=pById(S.playoff.champion);champ.career.titles++;let runner=S.players.find(p=>p.season.playoffRank===2);if(runner)runner.career.runnerups++;let aw=awards();growPlayers();let era=eraText();story('👑',`${champ.name} 시즌 ${S.seasonNo} 우승`,`${S.lastMatch.aw}:${S.lastMatch.bw} 결승 승리 · 리그 ${champ.season.leagueP}P + 순위결정전 ${champ.season.playoffP}P`);S.seasons.push({no:S.seasonNo,champion:champ.id,runnerup:runner?.id,standings:standings().map(p=>p.id),points:S.players.map(p=>({id:p.id,l:p.season.leagueP,p:p.season.playoffP})),awards:aw,stories:[...S.seasonStories],era});S.phase='done';save();toast(`${champ.name} 우승! 시즌 종료`)}
function totalP(p){return p.career.leagueP+p.career.playoffP}
function currentExpected(){if(S.phase==='league'){let m=currentLeagueMatch();if(!m)return null;let a=pById(m.a),b=pById(m.b),map=MAPS[0];return{a,b,p:winProb(a,b,map,false),label:'정규리그',bestOf:3}}if(S.phase==='playoff'){let i=playoffMatchInfo();if(!i)return null;return{...i,p:winProb(i.a,i.b,MAPS[0],true)}}return null}

function renderLeague(){let st=standings();document.getElementById('tab-league').innerHTML=`<div class="section-title"><h2>📋 전체 풀리그</h2><span class="pill">3전 2선승 · 15경기/인</span></div><div class="table-wrap"><table><thead><tr><th>순위</th><th>선수</th><th>종족</th><th>승</th><th>패</th><th>세트득실</th><th>연속</th><th>리그P</th></tr></thead><tbody>${st.map((p,i)=>`<tr><td class="${i<3?'rank'+(i+1):''}">${i+1}</td><td><button class="btn ghost" style="padding:5px 8px" onclick="openPlayer(${p.id})">${p.name}</button></td><td>${RACE_LABEL[p.race]}</td><td>${p.season.w}</td><td>${p.season.l}</td><td>${p.season.setsW-p.season.setsL>0?'+':''}${p.season.setsW-p.season.setsL}</td><td>${p.season.streak>0?'🔥 '+p.season.streak:p.season.streak<0?'🧊 '+Math.abs(p.season.streak):'-'}</td><td>${p.season.leagueRank?p.season.leagueP:'예정'}</td></tr>`).join('')}</tbody></table></div><div class="notice small" style="margin-top:10px">정규리그 종료 시 1위 16P부터 16위 1P까지 1점 차등 지급됩니다.</div>`}
function renderPlayoff(){let el=document.getElementById('tab-playoff');if(!S.playoff){el.innerHTML=`<div class="card"><h2>🏟️ 순위결정전</h2><p class="muted">정규리그 종료 후 16위 vs 15위부터 시작합니다. 승자는 한 단계 위 선수를 계속 상대합니다.</p><div class="ladder">${Array.from({length:16},(_,i)=>`<div class="ladder-step"><div class="seed">${16-i}위</div><strong>${16-i===3?'준플레이오프':16-i===2?'플레이오프':16-i===1?'결승전':'순위결정'}</strong></div>`).join('')}</div></div>`;return}let info=playoffMatchInfo();el.innerHTML=`<div class="section-title"><h2>🏟️ 순위결정전</h2><span class="pill">${S.playoff.matches.length}경기 완료</span></div><div class="ladder">${S.playoff.seeds.slice().reverse().map((id,i)=>{let p=pById(id),rank=16-i,done=p.season.playoffRank!=null;return`<div class="ladder-step ${done?'done':''} ${info&&(info.a.id===id||info.b.id===id)?'current':''}"><div class="seed">정규리그 ${rank}위</div><strong>${p.name}</strong><div class="small muted">${done?'최종 '+p.season.playoffRank+'위':p.season.fatigue?`피로 ${p.season.fatigue.toFixed(1)}`:'대기'}</div></div>`}).join('')}</div>${info?`<div class="card"><div class="row"><span class="pill warn">${info.label}</span><span class="pill">${info.bestOf}전 ${Math.ceil(info.bestOf/2)}선승</span></div><div class="scorebox"><div class="player-name">${info.a.name}</div><div class="vs">VS</div><div class="player-name">${info.b.name}</div></div><div class="row"><button class="btn primary" onclick="playPlayoff()">${info.label} 진행</button><span class="pill">${info.a.name} 피로 ${info.a.season.fatigue.toFixed(1)}</span><span class="pill">${info.b.name} 피로 ${info.b.season.fatigue.toFixed(1)}</span></div></div>`:`<div class="card champ"><h2>👑 ${pById(S.playoff.champion).name} 우승</h2><p>순위결정전이 종료되었습니다.</p></div>`}<div class="card" style="margin-top:14px"><h3>순위결정전 포인트</h3><div class="small muted">1위 10 · 2위 8 · 3위 7 · 4위 6 · 5위 5 · 6~7위 4 · 8~9위 3 · 10~12위 2 · 13~15위 1 · 16위 0</div></div>`}
function renderGrowth(){let sel=pById(S.selectedPlayer);document.getElementById('tab-growth').innerHTML=`<div class="grid two"><div class="card"><h2>📈 성장 센터</h2><p class="muted">잠재력은 능력별 최대 1000. 전성기·노쇠화와 시즌 경험에 따라 모든 선수가 변화합니다.</p><div class="player-grid">${S.players.map(p=>`<button class="player-card ${p.id===sel.id?'selected':''}" onclick="S.selectedPlayer=${p.id};save();render()"><strong>${p.name}</strong><div class="small muted">${p.agePhase} · ${Math.round(avg(p))}</div></button>`).join('')}</div></div><div class="card"><h3>${sel.name} 능력치</h3>${STAT_KEYS.map(k=>`<div class="meter"><span>${STAT_LABEL[k]}</span><div class="track"><div class="fill" style="width:${sel.stats[k]/10}%"></div></div><b>${sel.stats[k]}</b></div>`).join('')}<div class="row" style="margin-top:12px"><span class="pill">성장 단계 ${sel.agePhase}</span><span class="pill">평균 ${Math.round(avg(sel))}</span></div><h3 style="margin-top:16px">최근 성장 이유</h3>${sel.growthReason.length?sel.growthReason.map(x=>`<div class="story"><span>${x}</span></div>`).join(''):`<p class="muted small">시즌 결산 후 성장 내역이 표시됩니다.</p>`}</div></div>`}
function renderRanking(){let ps=[...S.players].sort((a,b)=>totalP(b)-totalP(a)||b.career.titles-a.career.titles);document.getElementById('tab-ranking').innerHTML=`<div class="section-title"><h2>🏆 역대 랭킹</h2><span class="pill">리그P + 순위결정전P</span></div><div class="table-wrap"><table><thead><tr><th>순위</th><th>선수</th><th>리그P</th><th>순위결정전P</th><th>총P</th><th>우승</th><th>준우승</th><th>MVP</th><th>통산 승률</th></tr></thead><tbody>${ps.map((p,i)=>{let n=p.career.wins+p.career.losses;return`<tr><td class="${i<3?'rank'+(i+1):''}">${i+1}</td><td><button class="btn ghost" style="padding:5px 8px" onclick="openPlayer(${p.id})">${p.name}</button></td><td>${p.career.leagueP}</td><td>${p.career.playoffP}</td><td><b>${totalP(p)}</b></td><td>${p.career.titles}</td><td>${p.career.runnerups}</td><td>${p.career.mvp}</td><td>${n?pct(p.career.wins/n):'-'}</td></tr>`}).join('')}</tbody></table></div>`}
function renderStory(){document.getElementById('tab-story').innerHTML=`<div class="section-title"><h2>📰 시즌 ${S.seasonNo} 스토리</h2><span class="pill">핵심 사건만 자동 기록</span></div>${S.seasonStories.length?S.seasonStories.map(x=>`<div class="story"><strong>${x.icon} ${x.title}</strong><span class="muted small">${x.text}</span></div>`).join(''):`<div class="card"><p class="muted">시즌을 진행하면 연승, 슬럼프, 라이벌, 천적, 대이변, 미라클런이 자동 기록됩니다.</p></div>`}`}
function goatScore(p){return totalP(p)+p.career.titles*18+p.career.runnerups*7+p.career.mvp*8+p.career.awards*2}
function rivalRows(){let out=[];Object.values(S.head2head).forEach(h=>{let n=h.aw+h.bw;if(n<5)return;let a=pById(h.a),b=pById(h.b),r=relation(a.id,b.id);if(r)out.push({a,b,h,r,n})});return out.sort((x,y)=>y.n-x.n)}
function renderRecords(){let goat=[...S.players].sort((a,b)=>goatScore(b)-goatScore(a)),rels=rivalRows();document.getElementById('tab-records').innerHTML=`<div class="grid two"><div class="card"><h2>🌟 명예의 전당 · GOAT</h2>${goat.slice(0,8).map((p,i)=>`<div class="statline"><span>${i+1}. <b>${p.name}</b></span><span>${goatScore(p)}점</span></div>`).join('')}<p class="small muted">총 랭킹P, 우승, 준우승, MVP와 시즌 어워드를 종합합니다.</p></div><div class="card"><h2>⚔️ 라이벌 · 천적</h2>${rels.length?rels.slice(0,10).map(x=>`<div class="story"><strong>${x.r.type==='라이벌'?'⚔️':'🎯'} ${x.a.name} vs ${x.b.name}</strong><span class="small muted">${x.r.type} · 상대전적 ${x.h.aw}:${x.h.bw} · 중요경기 ${x.h.important}회</span></div>`).join(''):`<p class="muted">맞대결이 쌓이면 자동 생성됩니다.</p>`}</div></div><div class="card" style="margin-top:14px"><h3>현재 시대</h3><div class="big">${eraText()}</div></div>`}
function renderSeasons(){document.getElementById('tab-seasons').innerHTML=`<div class="section-title"><h2>🗓️ 역대 시즌</h2><span class="pill">${S.seasons.length}시즌 완료</span></div>${S.seasons.length?[...S.seasons].reverse().map(s=>`<div class="card" style="margin-bottom:10px"><div class="statline"><div><span class="pill warn">시즌 ${s.no}</span> <strong>${pById(s.champion).name} 우승</strong></div><button class="btn ghost" onclick="openSeason(${s.no})">상세</button></div><div class="small muted">준우승 ${s.runnerup!=null?pById(s.runnerup).name:'-'} · ${s.era}</div></div>`).join(''):`<div class="card"><p class="muted">완료된 시즌이 없습니다.</p></div>`}`}
function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modalWrap').classList.add('show')}
function closeModal(){document.getElementById('modalWrap').classList.remove('show')}
function openPlayer(id){let p=pById(id),rels=S.players.filter(x=>x.id!==id).map(x=>({x,r:relation(id,x.id),h:h2h(id,x.id)})).filter(o=>o.r);openModal(`${p.name} 상세`, `<div class="summary-list"><div class="mini"><div class="label">종합</div><div class="value">${Math.round(avg(p))}</div></div><div class="mini"><div class="label">통산 포인트</div><div class="value">${totalP(p)}</div></div><div class="mini"><div class="label">우승</div><div class="value">${p.career.titles}</div></div><div class="mini"><div class="label">MVP</div><div class="value">${p.career.mvp}</div></div></div><h3>능력치</h3>${STAT_KEYS.map(k=>`<div class="meter"><span>${STAT_LABEL[k]}</span><div class="track"><div class="fill" style="width:${p.stats[k]/10}%"></div></div><b>${p.stats[k]}</b></div>`).join('')}<h3>현재 시즌</h3><div class="row"><span class="pill">리그 ${p.season.w}승 ${p.season.l}패</span><span class="pill">순위결정전 ${p.season.playoffW||0}승 ${p.season.playoffL||0}패</span><span class="pill">리그P ${p.season.leagueP}</span><span class="pill">순위결정전P ${p.season.playoffP}</span>${p.season.streak>=3?`<span class="pill good">🔥 ${p.season.streak}연승</span>`:''}</div><h3>관계</h3>${rels.length?rels.map(o=>`<div class="story"><strong>${o.r.type==='라이벌'?'⚔️':'🎯'} ${o.x.name} · ${o.r.type}</strong><span class="small muted">상대전적 ${id===o.h.a?o.h.aw:o.h.bw}:${id===o.h.a?o.h.bw:o.h.aw}</span></div>`).join(''):`<p class="muted small">아직 뚜렷한 라이벌/천적 관계가 없습니다.</p>`}`)}
function openLastMatch(){let m=S.lastMatch;if(!m)return toast('아직 경기 결과가 없습니다');let a=pById(m.a),b=pById(m.b),w=pById(m.winner);openModal(`${m.label} · ${w.name} 승리`,`<div class="scorebox"><div class="player-name">${a.name}</div><div class="score">${m.aw} : ${m.bw}</div><div class="player-name">${b.name}</div></div>${m.sets.map(s=>`<div class="story"><strong>${s.no}세트 · ${s.map} (${s.mapType})</strong><span class="small">${a.name} ${RACE_LABEL[s.aRace]} · ${s.aStrategy} / ${b.name} ${RACE_LABEL[s.bRace]} · ${s.bStrategy}</span><span class="small muted"> · 승자 ${pById(s.winner).name}</span></div>`).join('')}${m.upset?'<div class="notice">💥 사전 기대승률 30% 이하를 뒤집은 대이변 경기입니다.</div>':''}`)}
function openSeason(no){let s=S.seasons.find(x=>x.no===no);if(!s)return;let rows=[...s.points].sort((a,b)=>(b.l+b.p)-(a.l+a.p));openModal(`시즌 ${no} 결산`,`<h2>👑 ${pById(s.champion).name} 우승</h2><p class="muted">${s.era}</p><div class="table-wrap"><table><thead><tr><th>순위</th><th>선수</th><th>리그P</th><th>순위결정전P</th><th>합계</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td>${i+1}</td><td>${pById(x.id).name}</td><td>${x.l}</td><td>${x.p}</td><td><b>${x.l+x.p}</b></td></tr>`).join('')}</tbody></table></div><h3>시즌 어워드</h3>${s.awards.map(a=>`<div class="story"><strong>🏅 ${a.t} · ${pById(a.p).name}</strong>${a.v?`<span class="small muted">${a.v}</span>`:''}</div>`).join('')}`)}
function render(){renderNav();renderHome();renderMatch();renderLeague();renderPlayoff();renderGrowth();renderRanking();renderStory();renderRecords();renderSeasons();document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.getElementById('tab-'+S.activeTab).classList.add('active');updateQuick();if(S.lastMatch)showResult(S.lastMatch)}
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
</script>
</body>
</html>
